appId: com.shrinkly.app
productName: Shrinkly
copyright: Copyright © 2026 Shrinkly

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

extraResources:
  - from: build/icon.png
    to: icon.png

asar: true

win:
  icon: build/icon.png
  # 关闭 rcedit：electron-builder 需要解压 winCodeSign 里的 macOS 符号链接，
  # 而普通用户权限在 Windows 上无法创建符号链接（需要管理员或开发者模式）。
  # 如需把图标 / 版本信息写进 exe，请用管理员权限执行 `npm run build:win:iconed`。
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

artifactName: ${productName}-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}
  requestExecutionLevel: user

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Shrinkly
  installerLanguages:
    - zh_CN
  language: '2052'
  artifactName: ${productName}-${version}-setup.${ext}
